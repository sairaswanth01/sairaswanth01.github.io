<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10172a">
    <meta name="robots" content="noindex, nofollow">
    <title>We've moved | Sai Raswanth</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #10172a;
            color: #f7f8fc;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 28px;
            background:
                radial-gradient(ellipse at 18% 20%, rgba(80, 95, 255, .2), transparent 38%),
                radial-gradient(ellipse at 84% 82%, rgba(0, 210, 190, .13), transparent 36%),
                #10172a;
        }

        .glow {
            position: fixed;
            width: 360px;
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 50%;
            pointer-events: none;
        }

        .glow::before,
        .glow::after {
            position: absolute;
            inset: 28px;
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: inherit;
            content: "";
        }

        .glow::after {
            inset: 58px;
        }

        .glow-left {
            top: -210px;
            left: -150px;
        }

        .glow-right {
            right: -210px;
            bottom: -240px;
        }

        main {
            position: relative;
            width: min(100%, 590px);
            padding: clamp(32px, 7vw, 58px);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 28px;
            background: rgba(20, 29, 51, .82);
            box-shadow: 0 30px 100px rgba(0, 0, 0, .35);
            text-align: center;
            backdrop-filter: blur(18px);
            animation: arrive .7s ease-out both;
        }

        .mark {
            display: grid;
            width: 66px;
            height: 66px;
            margin: 0 auto 25px;
            place-items: center;
            border: 1px solid rgba(123, 236, 220, .35);
            border-radius: 21px;
            background: linear-gradient(145deg, rgba(47, 222, 194, .2), rgba(108, 121, 255, .2));
            color: #8df1df;
            font-size: 30px;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: #8df1df;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(38px, 8vw, 58px);
            letter-spacing: -.055em;
            line-height: 1.05;
        }

        .description {
            max-width: 390px;
            margin: 18px auto 28px;
            color: #b7c0d3;
            font-size: 16px;
            line-height: 1.7;
        }

        .address-label {
            display: block;
            margin-bottom: 10px;
            color: #8995ad;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .address {
            display: block;
            overflow-wrap: anywhere;
            color: #fff;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 650;
            text-decoration-color: rgba(141, 241, 223, .55);
            text-underline-offset: 5px;
        }

        .visit {
            display: inline-flex;
            min-height: 52px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
            padding: 0 24px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(100deg, #70e8d2, #9cf0dd);
            color: #10172a;
            font: inherit;
            font-weight: 750;
            text-decoration: none;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .visit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(112, 232, 210, .2);
        }

        .countdown {
            min-height: 22px;
            margin: 19px 0 0;
            color: #8995ad;
            font-size: 13px;
        }

        .stay {
            margin-top: 10px;
            padding: 6px 10px;
            border: 0;
            background: transparent;
            color: #b7c0d3;
            font: inherit;
            font-size: 13px;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .stay:hover {
            color: #fff;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="glow glow-left" aria-hidden="true"></div>
    <div class="glow glow-right" aria-hidden="true"></div>
    <main>
        <div class="mark" aria-hidden="true">↗</div>
        <p class="eyebrow">A new home for my website</p>
        <h1>We've moved!</h1>
        <p class="description">
            This website has a new address. Update your bookmarks and visit me at the new site.
        </p>
        <span class="address-label">Find me here</span>
        <a class="address" href="https://sairaswanth01.infinityfree.io/">
            sairaswanth01.infinityfree.io
        </a>
        <a class="visit" href="https://sairaswanth01.infinityfree.io/">
            Visit the new website <span aria-hidden="true">→</span>
        </a>
        <p class="countdown" id="countdown" aria-live="polite">
            Taking you to the new site in <span id="seconds">10</span> seconds…
        </p>
        <button class="stay" id="stay" type="button">Stay on this page</button>
    </main>
    <script>
        const destination = "https://sairaswanth01.infinityfree.io/";
        const countdown = document.getElementById("countdown");
        const seconds = document.getElementById("seconds");
        const stay = document.getElementById("stay");
        let remaining = 10;

        const timer = window.setInterval(() => {
            remaining -= 1;
            seconds.textContent = String(remaining);

            if (remaining <= 0) {
                window.clearInterval(timer);
                window.location.replace(destination);
            }
        }, 1000);

        stay.addEventListener("click", () => {
            window.clearInterval(timer);
            countdown.textContent = "Automatic redirect paused.";
            stay.hidden = true;
        });
    </script>
</body>
</html>
